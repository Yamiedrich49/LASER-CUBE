function soundLaser(){

function evaluate(level=LEVELS[stage],assigned=aims){const blocks=new Map();for(const p of level.blue)blocks.set(key(p),'blue');for(const p of level.gold)blocks.set(key(p),'gold');const snapshots=[new Set(blocks.keys())],steps=[];let damagedGold=false;
 for(let i=0;i<level.weapons.length;i++){
 const aim=assigned[i];if(!aim){return null}const order=beamCells(aim),type=level.weapons[i],ray=type==='laser'?order:order.filter(p=>blocks.has(key(p))).slice(0,1),hits=[],broken=[],goldHit=[];

 if(!shotsDone)return {i:-1,progress:0};

const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function hitMoment(type,n,total){return type==='laser'?.255+(.16*n)/Math.max(1,total-1):.445;}

function shattered(step,progress){

 const laser=step.type==='laser',color=laser?'#3bbfae':'#dba46b';
 for(const [ci,id] of step.broken.entries()){
  const t=clamp((progress-hitMoment(step.type,ci,step.broken.length))/.52,0,1);
  if(t<=0||t>=1)continue;
  const center=project(origin(id.split(',').map(Number)));
  const amount=laser?12:15;
  ctx.save();ctx.globalAlpha=Math.pow(1-t,1.15);
  for(let j=0;j<amount;j++){
   const ang=TAU*j/amount+ci*.92+(j%3)*.21;
   const radius=(laser?11:7)+(laser?31:45)*t*(.72+(j%5)*.075);
   const px=center.x+Math.cos(ang)*radius*t;
   const py=center.y+Math.sin(ang)*radius*t+(laser?3:19)*t*t;
   const size=(laser?1.5:3.9)*(1-.64*t)*(0.72+(j%4)*.13);
   ctx.save();ctx.translate(px,py);ctx.rotate(ang+1.2*t);
   if(laser){ctx.fillStyle=j%4===0?'#d9fff8':color;ctx.fillRect(-size*.35,-size*1.8,size*.75,size*3.1);}
   else{ctx.fillStyle=j%5===0?'#fff2d6':color;ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(size*.94,size*.6);ctx.lineTo(-size*.77,size*.8);ctx.closePath();ctx.fill();}
   ctx.restore();

   const radius=(laser?6:9)+(laser?21:26)*t;
   circle(center,radius,null,(1-t/.46)*(laser?.45:.65),laser?'#85e7d8':'#e9b77b',laser?1.2:2.3);
   if(!laser)circle(center,radius*.54,null,(1-t/.46)*.38,'#fff1d3',1.4);

}
function drawCubes(timing){
 const l=getLevel(),before=shotsDone&&report?report.snapshots[Math.min(timing.i,report.steps.length)]:null;

 const blocks=[...l.blue.map(p=>({p,kind:'blue'})),...l.gold.map(p=>({p,kind:'gold'}))];blocks.sort((a,b)=>visible(origin(a.p))-visible(origin(b.p)));

  if(!was)continue;

  if(state.opacity>.008)cubeFaces(b.p,b.kind,state.opacity,state.scale);
 }
 if(step){
  shattered(step,timing.progress);
  if(step.goldHit.length&&timing.progress>.22&&timing.progress<.77){
   for(const id of step.goldHit){const p=project(origin(id.split(',').map(Number))),f=clamp((timing.progress-.22)/.55,0,1);

}
function beamGradient(a,b,outer,inner,opacity=1){

 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
 ctx.strokeStyle=outer;ctx.lineWidth=11;ctx.shadowBlur=12;ctx.shadowColor=outer;ctx.globalAlpha=opacity*.33;ctx.stroke();
 ctx.shadowBlur=0;ctx.globalAlpha=opacity*.95;ctx.strokeStyle=outer;ctx.lineWidth=4.4;ctx.stroke();

}
function drawRay(now,t){
 const l=getLevel();if(!shotsDone){
  aims.forEach((aim,i)=>{if(!aim)return;const type=l.weapons[i],p=faceP(aim,.84),q=faceP(aim,.50);
    stroke(project(p),project(q),type==='laser'?'#119e94':'#ce9255',2.7,i===selected?.93:.45);
  });return;
 }
 if(!report||t.i<0||t.i>=l.weapons.length)return;
 const s=report.steps[t.i],aim=s.aim,type=s.type,ax=aim.axis;

  const end=faceP({...aim,sign:-aim.sign},.54),endPr=project(end);

  const fade=clamp((.89-t.progress)/.30,0,1);

  beamGradient(startPr,point,'#18b5a4','#f0fff8',fade);

   circle(q,1.2,'#dafff4',fade*(1-.1*j));

   const prev={x:mix(startPr.x,endPr.x,Math.max(0,f-.16)),y:mix(startPr.y,endPr.y,Math.max(0,f-.16))};
   beamGradient(prev,tip,'#e6ac62','#fff3d5',.86);
   circle(tip,6.2,'#a96a39',.92,'#f4d4a9',1.2);circle(tip,2.7,'#fff8e8',1);

    circle(endPr,8+31*life,null,(1-life)*.77,'#cd8d4d',2.5);
    circle(endPr,4+17*life,null,(1-life)*.50,'#f5d29d',1.2);

    ctx.restore();
   }
  }
 }
}

function setSelected(i){if(shotsDone)return;selected=i;tapSound();hud()}
function setAim(i,aim){if(shotsDone)return;aims[i]={...aim};history.push({i,aim:{...aim}});aimPulse={start:performance.now(),aim:{...aim},weapon:i};tapSound();const next=aims.findIndex((a,j)=>!a&&j!==i);if(next>=0)selected=next;hud()}
function nearestFace(x,y){const candidates=hitAreas.filter(a=>inPoly({x,y},a.corners));if(!candidates.length)return null;candidates.sort((a,b)=>b.depth-a.depth);return candidates[0].aim}
function planFire(){
 if(success){if(stage<LEVELS.length-1)show(stage+1);else show(0);tapSound();return}
 if(shotsDone){if(!settled)return;shotSeq++;shotsDone=false;settled=false;report=null;arena.classList.remove('firing','impact');hud();tapSound();return}
 if(aims.some(a=>!a))return;
 ensureAudio(); // Audio starts in the real button tap, not after a delayed callback.
 report=evaluate();if(!report)return;
 const run=++shotSeq;shotsDone=true;settled=false;startTime=performance.now();arena.classList.add('firing');hud();
 for(let i=0;i<aims.length;i++){
  const step=report.steps[i],base=i*STEP_MS;
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.type==='laser')soundLaser();else soundShot();
  },base+70);
  const impact=hitMoment(step.type,0,Math.max(1,step.broken.length));
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.broken.length) soundBreak(step.type,step.broken.length);
   arena.classList.add('impact');setTimeout(()=>{if(run===shotSeq)arena.classList.remove('impact')},105);
  },base+impact*STEP_MS);
 }
 setTimeout(()=>{
  if(run!==shotSeq||!shotsDone)return;
  settled=true;success=report.ok;arena.classList.remove('firing','impact');
  if(success){clearTime=performance.now();highest=Math.max(highest,Math.min(LEVELS.length-1,stage+1));soundWin();save();}
  else soundFail();hud();
 },aims.length*STEP_MS+60);
}

canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.px,dy=e.clientY-pointer.py;pointer.px=e.clientX;pointer.py=e.clientY;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>7)pointer.moved=true;if(pointer.moved){targetView=null;yaw+=dx*.011;pitch-=dy*.010;}});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(!pointer.moved&&!shotsDone){const r=canvas.getBoundingClientRect(),a=nearestFace(e.clientX-r.left,e.clientY-r.top);if(a)setAim(selected,a)}pointer=null});canvas.addEventListener('pointercancel',()=>pointer=null);
$('loadout').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)setSelected(Number(b.dataset.i))});
$('fireBtn').addEventListener('click',planFire);
$('resetBtn').addEventListener('click',()=>{if(shotsDone){shotSeq++;shotsDone=false;settled=false;success=false;report=null;arena.classList.remove('firing','impact');hud()}else{aims=getLevel().weapons.map(()=>null);selected=0;aimPulse.aim=null;hud();tapSound()}});
$('viewBtn').addEventListener('click',()=>{targetView=[defaultYaw,defaultPitch];tapSound()});
function soundHud(){$('soundBtn').style.color=soundOn?'#418e84':'#b2bfba';$('soundBtn').setAttribute('aria-pressed',String(soundOn))}
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;save();soundHud();tapSound()});
$('prev').addEventListener('click',()=>{if(stage>0)show(stage-1)});$('next').addEventListener('click',()=>{if(stage<highest)show(stage+1)});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(arena);
show(Math.min(stage,highest));soundHud();requestAnimationFrame(draw);
window.LASER_CUBE={LEVELS,show,evaluate,setAim,get aims(){return aims},get selected(){return selected},get stage(){return stage},get hitAreas(){return hitAreas},get camera(){return {yaw,pitch}},orbit(dx,dy){yaw+=dx;pitch+=dy},fire:planFire,get report(){return report},get settled(){return settled},get success(){return success},get shotsDone(){return shotsDone}};
})();
</script>
</body></html>
