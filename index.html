 polygon(corners,sel?(wt==='laser'?'rgba(86,204,255,.15)':'rgba(233,151,82,.14)'):'rgba(255,255,255,.10)',sel?(wt==='laser'?'rgba(67,176,221,.44)':'rgba(216,138,61,.42)'):'rgba(134,180,171,.16)',.75,1);
 const p=project(mid);if(!sel){circle(p,Math.max(2.0,scale*.056),'#fff',.88,'rgba(114,145,153,.30)',.8)}
 hitAreas.push({aim,corners,depth:p.depth,center:p});
 }
 }
 drawnAims();}
function drawShadow(){const base=project([0,0,-getLevel().dims[2]/2-.65]);ctx.save();ctx.fillStyle='rgba(64,103,92,.035)';ctx.beginPath();ctx.ellipse(base.x,base.y+12,scale*1.8,scale*.4,0,0,TAU);ctx.fill();ctx.restore()}
function draw(now){
 frame=requestAnimationFrame(draw);if(!W||!H)return;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const SNAP=Math.PI/15;
 if(targetView){rawYaw=mix(rawYaw,targetView[0],.27);rawPitch=mix(rawPitch,targetView[1],.27);
  if(Math.abs(rawYaw-targetView[0])+Math.abs(rawPitch-targetView[1])<.002){rawYaw=targetView[0];rawPitch=targetView[1];targetView=null}}
 yaw=Math.round(rawYaw/SNAP)*SNAP;pitch=Math.round(rawPitch/SNAP)*SNAP;
 const t=currentTiming(now);
 ctx.save();
 if(shotsDone&&report&&t.i>=0&&t.i<report.steps.length&&report.steps[t.i].type==='shot'){
   const d=t.progress-.446;
   if(d>0&&d<.17){const strength=Math.sin(Math.PI*d/.17)*2.25;
    ctx.translate(Math.sin(d*103)*strength,Math.cos(d*93)*strength*.5)}
 }
 drawShadow();drawFrame();drawCubes(t);drawRay(now,t);drawFaceTargets();drawAimPulse(now);
 if(shotsDone)drawnAims();drawCompletion(t);
 ctx.restore();
}

function weaponIcon(type){return type==='laser'?`<svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2.5" y="9" width="7" height="10" rx="1.8" fill="#ebfbff" stroke="#8fcde0" stroke-width="1.1"/><rect x="10.5" y="9" width="7" height="10" rx="1.8" fill="#ebfbff" stroke="#8fcde0" stroke-width="1.1"/><rect x="18.5" y="9" width="7" height="10" rx="1.8" fill="#ebfbff" stroke="#8fcde0" stroke-width="1.1"/><path d="M2 14h24" stroke="#3ccfff" stroke-width="2.8" stroke-linecap="round"/><path d="M2 14h24" stroke="#f9feff" stroke-width="1.1" stroke-linecap="round"/></svg>`:`<svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="9" width="7" height="10" rx="1.8" fill="#f8e0c5" stroke="#d39a61" stroke-width="1.1"/><rect x="18" y="9" width="7" height="10" rx="1.8" fill="none" stroke="#d7dede" stroke-width="1.1"/><path d="M2 14h8.2" stroke="#e08b39" stroke-width="2.3" stroke-linecap="round"/><circle cx="12.2" cy="14" r="2.6" fill="#e08b39" stroke="#a56428" stroke-width=".8"/><circle cx="12.2" cy="14" r="1.1" fill="#fff3e0"/></svg>`}
function hud(){const l=getLevel();$('count').textContent=String(stage+1).padStart(2,'0')+' / '+LEVELS.length;$('chapter').textContent=stage<3?'01 / 光と弾':stage<7?'02 / 方向を読む':'03 / 三手の設計';$('title').textContent=l.title;
 $('subtitle').textContent=stage===0?'シアンのレーザーは、一直線に貫通する。':stage===1?'オレンジのショットは、手前の一個だけ。':'ウイルスをすべて消し、ともだちキューブには当てない。';$('progress').style.width=(100*(stage+1)/LEVELS.length)+'%';$('prev').disabled=stage===0;$('next').disabled=stage>=highest;
 $('loadout').innerHTML=l.weapons.map((type,i)=>`<button class="weapon ${type} ${i===selected?'selected':''} ${aims[i]?'done':''}" data-i="${i}" aria-label="${i+1}発目 ${type==='laser'?'レーザー貫通':'ショット単発'} ${aims[i]?'照準済':'未設定'}" ${shotsDone?'disabled':''}><span class="weapon-num">${i+1}</span><span class="weapon-icon">${weaponIcon(type)}</span><span class="weapon-copy"><span class="weapon-type">${type==='laser'?'LASER':'SHOT'}</span><span class="weapon-state">${aims[i]?'面をロック':i===selected?'面をタップ':'まだ未設定'}</span></span></button>`).join('');
 const ready=aims.every(Boolean);$('fireBtn').disabled=!ready&&!shotsDone;
 $('fireBtn').classList.toggle('next',success);
 $('fireBtn').textContent=success?(stage===LEVELS.length-1?'14問クリア！ ↻':'次のステージへ →'):shotsDone?(settled?'照準を直す':'射撃中…'):(ready?`${l.weapons.length} 発、発射する`:'面をタップして狙おう');
 $('arenaHint').textContent=success?'完璧。ウイルスだけを消しきった。':shotsDone?(settled?'狙いを見直して、もう一度。':'レーザーは貫通、ショットは手前の一個だけ'):aims.every(Boolean)?'どこから撃つか、最後に確認しよう':`「${l.weapons[selected]==='laser'?'LASER：一直線に貫通':'SHOT：最初の一個だけ'}」を選択中`;
 $('resetBtn').textContent=shotsDone?'戻す':'照準クリア';
 $('notice').classList.toggle('show',settled);$('notice').classList.toggle('bad',settled&&!success);
 if(settled){$('noticeTitle').textContent=success?'CLEAR!':report.goldHit.length?'ともだちに当たった！':report.wasted?'空振りがあった！':'ウイルスが残った';$('noticeDesc').textContent=success?'決めた射線が、ぴったり決まった。':report.goldHit.length?'ともだちキューブには当てず、ウイルスだけを消そう':report.wasted?'すべての武器を使って消そう':`${report.blueLeft.length}体、まだ残っている`}
}
function show(i){shotSeq++;stage=clamp(i,0,LEVELS.length-1);selected=0;aims=getLevel().weapons.map(()=>null);yaw=defaultYaw;pitch=defaultPitch;rawYaw=defaultYaw;rawPitch=defaultPitch;lastTickYaw=Math.round(defaultYaw/(Math.PI/15));lastTickPitch=Math.round(defaultPitch/(Math.PI/15));targetView=null;shotsDone=false;settled=false;success=false;report=null;history=[];hud();save();resize()}
function setSelected(i){if(shotsDone)return;selected=i;tapSound();hud()}
function setAim(i,aim){if(shotsDone)return;aims[i]={...aim};history.push({i,aim:{...aim}});aimPulse={start:performance.now(),aim:{...aim},weapon:i};tapSound();const next=aims.findIndex((a,j)=>!a&&j!==i);if(next>=0)selected=next;hud()}
function nearestFace(x,y){const candidates=hitAreas.filter(a=>inPoly({x,y},a.corners));if(!candidates.length)return null;candidates.sort((a,b)=>b.depth-a.depth);return candidates[0].aim}
function planFire(){
 if(success){if(stage<LEVELS.length-1)show(stage+1);else show(0);tapSound();return}
 if(shotsDone){if(!settled)return;shotSeq++;shotsDone=false;settled=false;report=null;arena.classList.remove('firing','impact');hud();tapSound();return}
 if(aims.some(a=>!a))return;
 ensureAudio(); // Audio starts in the real button tap, not after a delayed callback.
 report=evaluate();if(!report)return;
 const run=++shotSeq;shotsDone=true;settled=false;startTime=performance.now();arena.classList.add('firing');hud();
 for(let i=0;i<aims.length;i++){
  const step=report.steps[i],base=i*STEP_MS;
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.type==='laser')soundLaser();else soundShot();
  },base+70);
  const impact=hitMoment(step.type,0,Math.max(1,step.broken.length));
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.broken.length) soundBreak(step.type,step.broken.length);
   arena.classList.add('impact');setTimeout(()=>{if(run===shotSeq)arena.classList.remove('impact')},105);
  },base+impact*STEP_MS);
 }
 setTimeout(()=>{
  if(run!==shotSeq||!shotsDone)return;
  settled=true;success=report.ok;arena.classList.remove('firing','impact');
  if(success){clearTime=performance.now();highest=Math.max(highest,Math.min(LEVELS.length-1,stage+1));soundWin();save();}
  else soundFail();hud();
 },aims.length*STEP_MS+60);
}

canvas.addEventListener('pointerdown',e=>{ensureAudio();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.px,dy=e.clientY-pointer.py;pointer.px=e.clientX;pointer.py=e.clientY;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved){targetView=null;rawYaw+=dx*.0125;rawPitch-=dy*.0115;const SNAP=Math.PI/15;const iy=Math.round(rawYaw/SNAP),ip=Math.round(rawPitch/SNAP);if(iy!==lastTickYaw||ip!==lastTickPitch){lastTickYaw=iy;lastTickPitch=ip;const now=performance.now();if(now-lastRotSound>31){lastRotSound=now;soundRotate((iy%6===0)||(ip%6===0));}}}});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(!pointer.moved&&!shotsDone){const r=canvas.getBoundingClientRect(),a=nearestFace(e.clientX-r.left,e.clientY-r.top);if(a)setAim(selected,a)}pointer=null});canvas.addEventListener('pointercancel',()=>pointer=null);
$('loadout').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)setSelected(Number(b.dataset.i))});
$('fireBtn').addEventListener('click',planFire);
$('resetBtn').addEventListener('click',()=>{if(shotsDone){shotSeq++;shotsDone=false;settled=false;success=false;report=null;arena.classList.remove('firing','impact');hud()}else{aims=getLevel().weapons.map(()=>null);selected=0;aimPulse.aim=null;hud();tapSound()}});
$('viewBtn').addEventListener('click',()=>{const nearest=(v,t)=>v+((((t-v+Math.PI)%TAU)+TAU)%TAU-Math.PI);targetView=[nearest(rawYaw,defaultYaw),nearest(rawPitch,defaultPitch)];tapSound()});
function soundHud(){$('soundBtn').style.color=soundOn?'#418e84':'#b2bfba';$('soundBtn').setAttribute('aria-pressed',String(soundOn))}
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;save();soundHud();if(soundOn){ensureAudio();tapSound()}});
$('prev').addEventListener('click',()=>{if(stage>0)show(stage-1)});$('next').addEventListener('click',()=>{if(stage<highest)show(stage+1)});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(arena);document.addEventListener('visibilitychange',()=>{if(document.hidden)pointer=null});
show(Math.min(stage,highest));soundHud();requestAnimationFrame(draw);
window.LASER_CUBE={LEVELS,show,evaluate,setAim,get aims(){return aims},get selected(){return selected},get stage(){return stage},get hitAreas(){return hitAreas},get camera(){return {yaw,pitch,rawYaw,rawPitch}},orbit(dx,dy){rawYaw+=dx;rawPitch+=dy},fire:planFire,get report(){return report},get settled(){return settled},get success(){return success},get shotsDone(){return shotsDone},get soundOn(){return soundOn}};
})();
</script>
