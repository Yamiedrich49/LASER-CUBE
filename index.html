   const prev={x:mix(startPr.x,endPr.x,Math.max(0,f-.15)),y:mix(startPr.y,endPr.y,Math.max(0,f-.15))};
   stroke(prev,tip,'#e1ad77',3.1,.50);
   const angle=Math.atan2(endPr.y-startPr.y,endPr.x-startPr.x);
   ctx.save();ctx.translate(tip.x,tip.y);ctx.rotate(angle);
   ctx.fillStyle='#aa662e';ctx.strokeStyle='#ffe0a4';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(-9,-4.4);ctx.lineTo(2,-4.4);ctx.quadraticCurveTo(9,0,2,4.4);
   ctx.lineTo(-9,4.4);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffe4bc';ctx.fillRect(-6,-2.5,6,1.5);ctx.restore();
  }
  if(f>=.99&&t.progress<.79&&hit){
   const age=clamp((t.progress-.445)/.345,0,1);
   const fade=1-age;
   circle(endPr,7+36*age,null,fade*.7,'#d88f47',2.4);
   circle(endPr,3+21*age,null,fade*.48,'#f1c99c',1.3);
   ctx.save();ctx.globalAlpha=Math.max(0,1-age);ctx.lineWidth=2;ctx.strokeStyle='#fff1d7';
   for(let i=0;i<8;i++){
    const a=i*TAU/8+.21,r=12+19*age;
    stroke({x:endPr.x+Math.cos(a)*r*.47,y:endPr.y+Math.sin(a)*r*.47},
      {x:endPr.x+Math.cos(a)*r,y:endPr.y+Math.sin(a)*r},'#f3b875',1.9,fade);
   }
   ctx.restore();
  }
 }
}

function drawAimPulse(now){
 if(!aimPulse.aim||shotsDone)return;
 const e=(now-aimPulse.start)/420;if(e<0||e>1)return;
 const p=aimCornerPoint(aimPulse.aim),t=smooth(e),type=getLevel().weapons[aimPulse.weapon];
 circle(p,8+10*t,null,(1-e)*.55,type==='laser'?'#42cfff':'#dd8a3b',1.7);
}
function drawCompletion(t){
 if(!success||!settled)return;
 const age=clamp((performance.now()-clearTime)/880,0,1),p=project([0,0,0]),r=scale*(.7+1.35*age);
 circle(p,r,null,Math.pow(1-age,2)*.33,'#34b7a5',2);
}

function inPoly(pt,ps){let inside=false;for(let i=0,j=ps.length-1;i<ps.length;j=i++){const a=ps[i],b=ps[j];if(((a.y>pt.y)!==(b.y>pt.y))&&(pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x))inside=!inside}return inside}
function aimCornerPoint(aim){
 const d=getLevel().dims,other=[0,1,2].filter(i=>i!==aim.axis),mid=faceP(aim,.54);
 const center=project(mid);
 const corners=[[-.48,-.48],[.48,-.48],[.48,.48],[-.48,.48]].map(([u,v])=>{const p=mid.slice();p[other[0]]+=u;p[other[1]]+=v;return project(p)});
 const top=corners.reduce((best,p)=>p.y<best.y-.8 || (Math.abs(p.y-best.y)<.8&&p.x>best.x)?p:best,corners[0]);
 // A corner badge places the aim off the creature's central facial features.
 return {x:top.x+(top.x-center.x)*.38,y:top.y+(top.y-center.y)*.38};
}
function drawnAims(){
 for(let i=0;i<aims.length;i++){
  const aim=aims[i];if(!aim)continue;
  const isFront=camera()[aim.axis]*aim.sign>.05;if(!isFront)continue;
  const type=getLevel().weapons[i],color=type==='laser'?'#249fce':'#d38641',p=aimCornerPoint(aim);
  ctx.save();ctx.shadowColor='rgba(21,44,51,.16)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;
  circle(p,8.1,'#ffffff',.98,color,1.55);ctx.restore();
  print({x:p.x,y:p.y+.2},String(i+1),color,10,900);
 }
}
function drawFaceTargets(){hitAreas=[];if(shotsDone)return;const d=getLevel().dims,dir=camera();
 for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){
 if(dir[axis]*sign<.14)continue;
 const other=[0,1,2].filter(i=>i!==axis),A=d[other[0]],B=d[other[1]];
 for(let a=0;a<A;a++)for(let b=0;b<B;b++){
 const aim={axis,sign,a,b},mid=faceP(aim,.54),corners=[[-.49,-.49],[.49,-.49],[.49,.49],[-.49,.49]].map(([u,v])=>{const p=mid.slice();p[other[0]]+=u;p[other[1]]+=v;return project(p)});
 // Target polygons are invisible hit zones. No dots, fill, or grid drawn on faces:
 // facial expressions must always remain unobstructed while turning.
 const p=project(mid);
 hitAreas.push({aim,corners,depth:p.depth,center:p});
 }
 }
 drawnAims();}
function drawShadow(){const base=project([0,0,-getLevel().dims[2]/2-.65]);ctx.save();ctx.fillStyle='rgba(64,103,92,.035)';ctx.beginPath();ctx.ellipse(base.x,base.y+12,scale*1.8,scale*.4,0,0,TAU);ctx.fill();ctx.restore()}
function draw(now){
 frame=requestAnimationFrame(draw);if(!W||!H)return;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const SNAP=Math.PI/15;
 if(targetView){rawYaw=mix(rawYaw,targetView[0],.27);rawPitch=mix(rawPitch,targetView[1],.27);
  if(Math.abs(rawYaw-targetView[0])+Math.abs(rawPitch-targetView[1])<.002){rawYaw=targetView[0];rawPitch=targetView[1];targetView=null}}
 const stepYaw=Math.round(rawYaw/SNAP)*SNAP,stepPitch=Math.round(rawPitch/SNAP)*SNAP;
 // Critically damped short settle; each click remains distinct without frame-to-frame teleportation.
 yaw+=(stepYaw-yaw)*.58; pitch+=(stepPitch-pitch)*.58;
 if(Math.abs(stepYaw-yaw)<.00015)yaw=stepYaw;
 if(Math.abs(stepPitch-pitch)<.00015)pitch=stepPitch;
 const t=currentTiming(now);
 ctx.save();
 if(shotsDone&&report&&t.i>=0&&t.i<report.steps.length&&report.steps[t.i].type==='shot'){
   const d=t.progress-.446;
   if(d>0&&d<.17){const strength=Math.sin(Math.PI*d/.17)*2.25;
    ctx.translate(Math.sin(d*103)*strength,Math.cos(d*93)*strength*.5)}
 }
 drawShadow();drawFrame();drawCubes(t);drawRay(now,t);drawFaceTargets();drawAimPulse(now);
 if(shotsDone)drawnAims();drawCompletion(t);
 ctx.restore();
}

function weaponIcon(type){return type==='laser'?
 `<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#edfaff" stroke="#8fc9db" stroke-width="1.1"><rect x="6" y="5" width="6" height="22" rx="1.5"/><rect x="14" y="5" width="6" height="22" rx="1.5"/><rect x="22" y="5" width="6" height="22" rx="1.5"/></g><path d="M1.5 16H30.5" stroke="#16add6" stroke-width="4.2" stroke-linecap="round"/><path d="M1.5 16H30.5" stroke="#f7feff" stroke-width="1.6" stroke-linecap="round"/><circle cx="30" cy="16" r="2" fill="#4bd8ff"/></svg>`:
 `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 16H12" stroke="#dfa264" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2"/><path d="M10 12.7h7a4.3 4.3 0 0 1 0 6.6h-7Z" fill="#c17d3e" stroke="#8f582b" stroke-width="1"/><path d="M12 14h4" stroke="#ffe3bd" stroke-width="1.2" stroke-linecap="round"/><rect x="24" y="7" width="3" height="18" rx="1.2" fill="#b9d0d4" stroke="#789da3" stroke-width=".8"/><path d="M20 8l1.3 3M20 24l1.3-3M28.5 11l1.7-2M28.5 21l1.7 2" stroke="#e6ae72" stroke-width="1.5" stroke-linecap="round"/></svg>`}
function hud(){const l=getLevel();$('count').textContent=String(stage+1).padStart(2,'0')+' / '+LEVELS.length;const ch=stage<15?'01 / 導入':stage<35?'02 / 一手先':stage<55?'03 / 立体の形':stage<80?'04 / 三手設計':'05 / 応用試験';$('chapter').textContent=ch;$('title').textContent=l.title;
 $('subtitle').textContent=stage===0?'シアンのレーザーは、一直線に貫通する。':stage===1?'オレンジのショットは、手前の一個だけ。':'黒むらさきのバイキンを消して、白いともだちは守ろう。';$('progress').style.width=(100*(stage+1)/LEVELS.length)+'%';$('prev').disabled=stage===0;$('next').disabled=stage>=highest;
 $('loadout').innerHTML=l.weapons.map((type,i)=>`<button class="weapon ${type} ${i===selected?'selected':''} ${aims[i]?'done':''}" data-i="${i}" aria-label="${i+1}発目 ${type==='laser'?'レーザー貫通':'ショット単発'} ${aims[i]?'照準済':'未設定'}" ${shotsDone?'disabled':''}><span class="weapon-num">${i+1}</span><span class="weapon-icon">${weaponIcon(type)}</span><span class="weapon-mark">${aims[i]?'●':i===selected?'○':' '}</span></button>`).join('');
 const ready=aims.every(Boolean);$('fireBtn').disabled=!ready&&!shotsDone;
 $('fireBtn').classList.toggle('next',success);
 $('fireBtn').textContent=success?(stage===LEVELS.length-1?`${LEVELS.length}問クリア！ ↻`:'次のステージへ →'):shotsDone?(settled?'照準を直す':'射撃中…'):(ready?`${l.weapons.length} 発、発射する`:'面をタップして狙おう');
 $('arenaHint').textContent=success?'完璧。バイキンだけを消しきった。':shotsDone?(settled?'狙いを見直して、もう一度。':'レーザーは貫通、ショットは手前の一個だけ'):aims.every(Boolean)?'発射前に、向きをひと呼吸だけ確認。':`${selected+1}手目を選択中`;
 $('resetBtn').textContent=shotsDone?'戻す':(aims[selected]?'この手を消す':aims.some(Boolean)?'全部消す':'照準クリア');
 $('notice').classList.toggle('show',settled);$('notice').classList.toggle('bad',settled&&!success);
 if(settled){$('noticeTitle').textContent=success?'CLEAR!':report.goldHit.length?'ともだちに当たった！':report.wasted?'空振りがあった！':'ウイルスが残った';$('noticeDesc').textContent=success?'決めた射線が、ぴったり決まった。':report.goldHit.length?'ともだちキューブには当てず、ウイルスだけを消そう':report.wasted?'すべての武器を使って消そう':`${report.blueLeft.length}体、まだ残っている`}
}
function show(i){shotSeq++;stage=clamp(i,0,LEVELS.length-1);selected=0;aims=getLevel().weapons.map(()=>null);yaw=defaultYaw;pitch=defaultPitch;rawYaw=defaultYaw;rawPitch=defaultPitch;lastTickYaw=Math.round(defaultYaw/(Math.PI/15));lastTickPitch=Math.round(defaultPitch/(Math.PI/15));targetView=null;shotsDone=false;settled=false;success=false;report=null;history=[];hud();save();resize()}
function setSelected(i){if(shotsDone)return;selected=i;tapSound();hud()}
function setAim(i,aim){if(shotsDone)return;aims[i]={...aim};history.push({i,aim:{...aim}});aimPulse={start:performance.now(),aim:{...aim},weapon:i};tapSound();const next=aims.findIndex((a,j)=>!a&&j!==i);if(next>=0)selected=next;hud()}
function nearestFace(x,y){const candidates=hitAreas.filter(a=>inPoly({x,y},a.corners));if(!candidates.length)return null;candidates.sort((a,b)=>b.depth-a.depth);return candidates[0].aim}
function planFire(){
 if(success){if(stage<LEVELS.length-1)show(stage+1);else show(0);tapSound();return}
 if(shotsDone){if(!settled)return;shotSeq++;shotsDone=false;settled=false;report=null;arena.classList.remove('firing','impact');hud();tapSound();return}
 if(aims.some(a=>!a))return;
 ensureAudio(); // Audio starts in the real button tap, not after a delayed callback.
 report=evaluate();if(!report)return;
 const run=++shotSeq;shotsDone=true;settled=false;startTime=performance.now();arena.classList.add('firing');hud();
 for(let i=0;i<aims.length;i++){
  const step=report.steps[i],base=i*STEP_MS;
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.type==='laser')soundLaser();else soundShot();
  },base+70);
  const impact=hitMoment(step.type,0,Math.max(1,step.broken.length));
  setTimeout(()=>{
   if(run!==shotSeq||!shotsDone)return;
   if(step.broken.length) soundBreak(step.type,step.broken.length);
   arena.classList.add('impact');setTimeout(()=>{if(run===shotSeq)arena.classList.remove('impact')},105);
  },base+impact*STEP_MS);
 }
 setTimeout(()=>{
  if(run!==shotSeq||!shotsDone)return;
  settled=true;success=report.ok;arena.classList.remove('firing','impact');
  if(success){clearTime=performance.now();highest=Math.max(highest,Math.min(LEVELS.length-1,stage+1));soundWin();save();}
  else soundFail();hud();
 },aims.length*STEP_MS+60);
}

canvas.addEventListener('pointerdown',e=>{if(e.cancelable)e.preventDefault();ensureAudio();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(e.cancelable)e.preventDefault();const dx=e.clientX-pointer.px,dy=e.clientY-pointer.py;pointer.px=e.clientX;pointer.py=e.clientY;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved){targetView=null;rawYaw+=dx*.0125;rawPitch-=dy*.0115;const SNAP=Math.PI/15;const iy=Math.round(rawYaw/SNAP),ip=Math.round(rawPitch/SNAP);if(iy!==lastTickYaw||ip!==lastTickPitch){lastTickYaw=iy;lastTickPitch=ip;const now=performance.now();if(now-lastRotSound>31){lastRotSound=now;soundRotate((iy%6===0)||(ip%6===0));}}}});
function tapAim(aim){
 if(shotsDone||!aim)return;
 // The same cell always cancels the already placed aim, even after auto-advancing.
 let existing=isSameAim(aims[selected],aim)?selected:-1;
 if(existing<0){for(let i=aims.length-1;i>=0;i--){if(isSameAim(aims[i],aim)){existing=i;break}}}
 if(existing>=0){aims[existing]=null;selected=existing;aimPulse.aim=null;tapSound();hud();return}
 setAim(selected,aim);
}
function aimAtTap(x,y){
 // Aiming on the block OR directly tapping its numbered corner badge both cancel it.
 for(let i=aims.length-1;i>=0;i--){const a=aims[i];if(!a||camera()[a.axis]*a.sign<=.05)continue;
  const p=aimCornerPoint(a);if(Math.hypot(x-p.x,y-p.y)<=14)return a;
 }
 return nearestFace(x,y);
}
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;if(e.cancelable)e.preventDefault();if(!pointer.moved&&!shotsDone){const r=canvas.getBoundingClientRect(),a=aimAtTap(e.clientX-r.left,e.clientY-r.top);if(a)tapAim(a)}pointer=null});canvas.addEventListener('pointercancel',()=>pointer=null);
// Safari can scroll the whole page when a gesture moves beyond the initial hit area.
// Explicitly suppress that native gesture while the puzzle is being manipulated.
arena.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
canvas.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(pointer&&e.cancelable)e.preventDefault()},{passive:false});
$('loadout').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b||shotsDone)return;const i=Number(b.dataset.i);if(i===selected&&aims[i]){aims[i]=null;tapSound();hud();return}setSelected(i)});
$('fireBtn').addEventListener('click',planFire);
$('resetBtn').addEventListener('click',()=>{if(shotsDone){shotSeq++;shotsDone=false;settled=false;success=false;report=null;arena.classList.remove('firing','impact');hud()}else if(aims[selected]){aims[selected]=null;aimPulse.aim=null;hud();tapSound()}else{aims=getLevel().weapons.map(()=>null);selected=0;aimPulse.aim=null;hud();tapSound()}});
$('viewBtn').addEventListener('click',()=>{const nearest=(v,t)=>v+((((t-v+Math.PI)%TAU)+TAU)%TAU-Math.PI);targetView=[nearest(rawYaw,defaultYaw),nearest(rawPitch,defaultPitch)];tapSound()});
function soundHud(){$('soundBtn').style.color=soundOn?'#418e84':'#b2bfba';$('soundBtn').setAttribute('aria-pressed',String(soundOn))}
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;save();soundHud();if(soundOn){ensureAudio();tapSound()}});
$('prev').addEventListener('click',()=>{if(stage>0)show(stage-1)});$('next').addEventListener('click',()=>{if(stage<highest)show(stage+1)});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(arena);document.addEventListener('visibilitychange',()=>{if(document.hidden)pointer=null});
show(Math.min(stage,highest));soundHud();requestAnimationFrame(draw);
window.LASER_CUBE={LEVELS,show,evaluate,setAim,tapAim,get aims(){return aims},get selected(){return selected},get stage(){return stage},get hitAreas(){return hitAreas},get camera(){return {yaw,pitch,rawYaw,rawPitch}},orbit(dx,dy){rawYaw+=dx;rawPitch+=dy},fire:planFire,get report(){return report},get settled(){return settled},get success(){return success},get shotsDone(){return shotsDone},get soundOn(){return soundOn}};
})();
</script>
